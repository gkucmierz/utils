name: Deploy Docs & Dual-Publish Package (@gkucmierz/utils)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    uses: gkucmierz/ci-workflows/.gitea/workflows/publish-package.yml@main
    with:
      runs_on: self-hosted-pl
      run_tests: true
      run_build: true
      build_script: 'build:main'
      publish_private: true
      publish_npmjs: true
      gitea_owner: 'gkucmierz'
      package_scope: '@gkucmierz'
    secrets: inherit

  deploy-docs:
    name: Deploy Docs Website (docs-utils.7u.pl)
    needs: publish
    runs-on: self-hosted-pl
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Zero-downtime Docker build & deployment
        run: |
          docker compose build
          docker compose up -d --remove-orphans
